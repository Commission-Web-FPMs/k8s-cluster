# Exemple documentaire, non monté par le worker.
# Nécessite les deux fichiers Secret et l'URL de callback réelle.
version: 1
metadata:
  name: Fede - Carte-fede main
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Fede - Groupes
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true

  # Profil d'exemple : lecture globale des utilisateurs et groupes.
  # Aucun droit de création, modification, suppression ou gestion des tokens.
  - model: authentik_rbac.role
    state: present
    id: api-reader
    identifiers:
      name: carte-fede-main-api-reader
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.view_group
  - model: authentik_core.user
    state: present
    id: service-account
    identifiers:
      username: svc-carte-fede-main
    attrs:
      name: Carte-fede main API
      type: service_account
      path: service-accounts/carte-fede
      is_active: true
      groups: []
      roles:
        - !KeyOf api-reader
      permissions: []
  - model: authentik_core.token
    state: present
    identifiers:
      identifier: carte-fede-main-api
    attrs:
      user: !KeyOf service-account
      intent: api
      expiring: false
      key: !File /secrets/carte-fede/AUTHENTIK_API_TOKEN

  # Exemple pour un backend qui conserve le secret OIDC.
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    id: oidc-provider
    identifiers:
      name: carte-fede-main-oidc
    attrs:
      client_id: carte-fede-main
      client_type: confidential
      client_secret: !File /secrets/carte-fede/OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: !Env CARTE_FEDE_OIDC_REDIRECT_URI
      issuer_mode: per_provider
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, !Env CARTE_FEDE_OIDC_SIGNING_KEY_NAME]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    state: present
    id: application
    identifiers:
      slug: carte-fede-main
    attrs:
      name: Carte-fede main
      provider: !KeyOf oidc-provider
      meta_launch_url: https://carte-fede-main.web.magellan.fpms.ac.be
      policy_engine_mode: any

  # Accès OIDC pour chacun des trois groupes. Le SA n'en fait pas partie.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf application
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, membres]]
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf application
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, comite]]
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf application
      order: 2
    attrs:
      group: !Find [authentik_core.group, [name, admin]]
