apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"

spec:
  project: default

  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2026.8.2

    helm:
      valuesObject:
        # Secret applicatif authentik.
        #
        # Le Secret doit notamment contenir :
        #   AUTHENTIK_SECRET_KEY: <secret généré>
        #   AUTHENTIK_POSTGRESQL__PASSWORD: <mot de passe CNPG>
        authentik:
          existingSecret:
            secretName: authentik-secret

        server:
          podAnnotations:
            carte-fede.fpms.ac.be/scrypt-settings-sha256: "660e1d023fee18b1b3d2964e5c0e7cacce1e5102d606d6c362b7f7936279dcc6"
          deploymentStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumes:
            - name: scrypt-settings
              configMap:
                name: authentik-scrypt-settings
          volumeMounts:
            - name: scrypt-settings
              mountPath: /data/hashers.py
              subPath: hashers.py
              readOnly: true
            - name: scrypt-settings
              mountPath: /data/user_settings.py
              subPath: user_settings.py
              readOnly: true

        worker:
          # Real exec probes can exceed 3 seconds during CPU contention.
          livenessProbe:
            timeoutSeconds: 10
            periodSeconds: 30
          readinessProbe:
            timeoutSeconds: 10
            periodSeconds: 30
          startupProbe:
            timeoutSeconds: 10
          podAnnotations:
            carte-fede.fpms.ac.be/scrypt-settings-sha256: "660e1d023fee18b1b3d2964e5c0e7cacce1e5102d606d6c362b7f7936279dcc6"
          deploymentStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          envFrom:
            - secretRef:
                name: authentik-bootstrap
          volumes:
            - name: carte-fede-migration-api
              secret:
                secretName: carte-fede-migration-api
            - name: scrypt-settings
              configMap:
                name: authentik-scrypt-settings
            - name: carte-fede-credentials
              secret:
                secretName: carte-fede-credentials
            - name: carte-fede-config
              configMap:
                name: authentik-config
          volumeMounts:
            - name: carte-fede-migration-api
              mountPath: /secrets/carte-fede-migration
              readOnly: true
            - name: scrypt-settings
              mountPath: /data/hashers.py
              subPath: hashers.py
              readOnly: true
            - name: scrypt-settings
              mountPath: /data/user_settings.py
              subPath: user_settings.py
              readOnly: true
            - name: carte-fede-credentials
              mountPath: /secrets/carte-fede
              readOnly: true
            - name: carte-fede-config
              mountPath: /config/carte-fede
              readOnly: true

        blueprints:
          configMaps:
            - authentik-blueprints

        global:
          image:
            repository: ghcr.io/goauthentik/server
            tag: 2026.8.2
            digest: sha256:ff8489a5af4f4fe415ffd180a8e3c10b120bc2592d13d79dac050d977f7b9ecd
          env:
            - name: AUTHENTIK_LOG_LEVEL
              value: warning
            - name: AUTHENTIK_WEB__WORKERS
              value: "1"
            - name: AUTHENTIK_WEB__THREADS
              value: "2"
            - name: AUTHENTIK_WEB__BASE_URL
              value: https://auth.fede.fpms.ac.be
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: comweb-db-rw.comweb-db.svc.cluster.local
            - name: AUTHENTIK_POSTGRESQL__PORT
              value: "5432"
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__USER
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__SSLMODE
              value: require

        # On utilise CNPG, pas le PostgreSQL embarqué
        # dans le chart authentik.
        postgresql:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
