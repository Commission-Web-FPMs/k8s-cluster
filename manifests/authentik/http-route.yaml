apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: http
  hostnames:
    - auth.web.magellan.fpms.ac.be
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Vérifié par helm template : Service port 80 -> conteneur port 9000.
        - name: authentik-server
          port: 80
