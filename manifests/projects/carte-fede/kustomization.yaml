apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - application.yaml
  - namespace-main.yaml
  - npm-only.middleware.yaml
  - access.networkpolicy.yaml
  - backend-credentials-main.sealed.yaml
  - authentik-credentials-main.sealed.yaml
  - database/main
  - ../../authentik/integrations/carte-fede-main/application

patches:
  - target:
      group: bitnami.com
      kind: SealedSecret
    patch: |
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: ignore
        annotations:
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  - target:
      group: postgresql.cnpg.io
    patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: ignore
      metadata:
        name: ignore
        annotations:
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  - target:
      group: postgresql.cnpg.io
      kind: Database
      name: carte-fede-main
      namespace: comweb-db
    patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Database
      metadata:
        name: carte-fede-main
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false,SkipDryRunOnMissingResource=true
  - target:
      group: postgresql.cnpg.io
      kind: DatabaseRole
      name: carte-fede-main
      namespace: comweb-db
    patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      metadata:
        name: carte-fede-main
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false,SkipDryRunOnMissingResource=true
