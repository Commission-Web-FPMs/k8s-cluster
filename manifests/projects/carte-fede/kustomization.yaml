apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - application.yaml
  - namespace-main.yaml
  - authentik-credentials-main.sealed.yaml
  - ../../authentik/integrations/carte-fede-main/application

patches:
  - target:
      group: bitnami.com
      kind: SealedSecret
    patch: |
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: ignore
        annotations:
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
