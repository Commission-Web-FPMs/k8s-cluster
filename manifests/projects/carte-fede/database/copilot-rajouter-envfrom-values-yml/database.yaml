apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: carte-fede-copilot-rajouter-envfrom-values-yml
  namespace: comweb-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  cluster:
    name: comweb-db
  name: carte_fede_copilot_rajouter_envfrom_values_yml
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: carte-fede-copilot-rajouter-envfrom-values-yml-db-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: carte-fede-copilot-rajouter-envfrom-values-yml
  namespace: comweb-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  cluster:
    name: comweb-db
  name: carte_fede_copilot_rajouter_envfrom_values_yml
  owner: carte_fede_copilot_rajouter_envfrom_values_yml
  databaseReclaimPolicy: retain
