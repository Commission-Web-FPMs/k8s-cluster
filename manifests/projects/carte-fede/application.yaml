apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: carte-fede
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - scmProvider:
        cloneProtocol: https

        github:
          organization: Commission-Web-FPMs
          appSecretName: github-app
          allBranches: true

        filters:
          # Le SCM generator travaille au niveau de l'organisation,
          # donc on restreint au repo voulu.
          - repositoryMatch: '^carte-fede-deployment$'

        requeueAfterSeconds: 60
        

  template:
    metadata:
      name: 'carte-fede-{{ .branchNormalized }}'

    spec:
      project: default

      source:
        repoURL: https://github.com/Commission-Web-FPMs/carte-fede-deployment.git

        # Chaque Application suit sa propre branche.
        targetRevision: '{{ .branch }}'

        # Si Chart.yaml est à la racine
        path: .

        helm:
          values: |
            {{- if eq .branch "main" }}
            replicaCount: 0
            frontend:
              replicaCount: 0
            env:
              - name: AUTO_CREATE_DB
                value: "0"
              - name: SESSION_COOKIE_SECURE
                value: "true"
              - name: REMEMBER_COOKIE_SECURE
                value: "true"
              - name: PROXY_FIX_X_FOR
                value: "1"
              - name: PROXY_FIX_X_PROTO
                value: "1"
              - name: PROXY_FIX_X_HOST
                value: "1"
              - name: PROXY_FIX_X_PORT
                value: "0"
              - name: PROXY_FIX_X_PREFIX
                value: "0"
              - name: FRONTEND_BASE_URL
                value: "https://carte-fede-main.web.magellan.fpms.ac.be"
              - name: GUNICORN_CMD_ARGS
                value: "--access-logformat='%(m)s %(s)s %(L)s'"
            envFrom:
              - secretRef:
                  name: postgresql-credentials
              - secretRef:
                  name: carte-fede-backend-credentials
              - configMapRef:
                  name: authentik-config
              - secretRef:
                  name: authentik-credentials
            {{- end }}
            {{- if eq .branch "main" }}
            rateLimit:
              sourceCriterion:
                ipStrategy:
                  depth: 1
            {{- end }}
            httpRoute:
              {{- if eq .branch "main" }}
              filters:
                - type: ExtensionRef
                  extensionRef:
                    group: traefik.io
                    kind: Middleware
                    name: carte-fede-npm-only
              {{- end }}
              hostnames:
                # Il y a pas encore le hostname *.k8s-dev.magellan.fpms.ac.be
                # - '{{ .branchNormalized }}.dev.fede.fpms.ac.be'
                # Donc on fait comme on peut mdr:
                # - k8s-dev.magellan.fpms.ac.be
                # ça va rentrer en conflit si plusieurs branches
                # il faut le path pour différencier (mais l'image le supporte pas encore...)
                - 'carte-fede-{{ .branchNormalized }}.web.magellan.fpms.ac.be'
                


      destination:
        server: https://kubernetes.default.svc
        namespace: 'carte-fede-{{ .branchNormalized }}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
