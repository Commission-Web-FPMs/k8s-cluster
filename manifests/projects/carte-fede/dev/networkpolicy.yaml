apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carte-fede-dev-isolation
  namespace: carte-fede-dev
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 8000
      protocol: TCP
    - port: 8080
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: comweb-db
      podSelector:
        matchLabels:
          cnpg.io/cluster: comweb-db
    ports:
    - port: 5432
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 193.190.211.21/32
    - ipBlock:
        cidr: 172.17.0.1/32
    ports:
    - port: 443
      protocol: TCP
