version: 1
metadata:
  name: Carte Fede DEV dedicated OIDC
entries:
  - model: authentik_core.group
    state: present
    id: dev-testers
    identifiers: {name: carte-fede-dev-testers}
    attrs: {is_superuser: false, parents: [], roles: []}
  - model: authentik_providers_oauth2.scopemapping
    state: present
    id: dev-scope
    identifiers: {name: carte-fede-dev-identity}
    attrs:
      scope_name: carte_fede_dev
      description: Synthetic DEV identity and activation only
      expression: |
        allowed = user.is_active and ak_is_group_member(user, name="carte-fede-dev-testers")
        return {"carte_fede_uuid": user.attributes.get("carte_fede_dev_uuid", ""), "carte_fede_dev_allowed": bool(allowed)}
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    id: dev-provider
    identifiers: {name: carte-fede-dev-oidc}
    attrs:
      client_id: carte-fede-dev
      client_type: confidential
      client_secret: !File /secrets/dev/OIDC_CLIENT_SECRET
      grant_types: [authorization_code]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: https://carte-dev.fede.fpms.ac.be/api/auth/oidc/callback
      issuer_mode: per_provider
      sub_mode: user_uuid
      access_token_validity: minutes=5
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf dev-scope
  - model: authentik_core.application
    state: present
    id: dev-application
    identifiers: {slug: carte-fede-dev}
    attrs:
      name: Carte Fede DEV
      provider: !KeyOf dev-provider
      meta_launch_url: https://carte-dev.fede.fpms.ac.be
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    state: present
    identifiers: {target: !KeyOf dev-application, order: 0}
    attrs:
      group: !KeyOf dev-testers
