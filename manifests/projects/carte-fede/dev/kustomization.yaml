apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- database.yaml
- credentials.sealed.yaml
- project.yaml
- application.yaml
- quota.yaml
- npm-only.middleware.yaml
- networkpolicy.yaml
- authentik-job.yaml
- registration.credentials.sealed.yaml
configMapGenerator:
- name: carte-fede-dev-authentik-blueprint
  namespace: authentik
  files:
  - blueprint.yaml=authentik-blueprint.yaml
  - provision.py=authentik-provision.py
  - enrollment-blueprint.yaml=enrollment-blueprint.yaml
generatorOptions:
  disableNameSuffixHash: true
