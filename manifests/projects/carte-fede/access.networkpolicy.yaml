apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carte-fede-access
  namespace: carte-fede-main
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8080
