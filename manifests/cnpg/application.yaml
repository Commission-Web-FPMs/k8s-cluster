# Installe l'opérateur CloudNativePG dans le cluster Kubernetes.
#
# L'opérateur n'est que le contrôleur : il n'installe aucune base de données. Il
# apporte la ressource `Cluster` du groupe postgresql.cnpg.io, et les clusters
# PostgreSQL sont ensuite déclarés en vague 1, dans cluster/.
#
# Version : le chart 0.29.0 correspond à l'opérateur 1.30.0, qui prend en charge
# Kubernetes 1.34 à 1.36. Le cluster tourne en 1.36 (voir k0sctl.yaml), donc
# 1.29.x ne conviendrait pas : les deux versions doivent monter ensemble.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd

  # Pas de finalizer, sur le même raisonnement que sealed-secrets : la
  # suppression de cette Application supprimerait la CRD `Cluster`, donc tous
  # les clusters PostgreSQL du cluster Kubernetes, donc leurs volumes. Sans
  # finalizer, le retrait laisse ces objets en place.
spec:
  project: default

  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

      # Les CRDs de CloudNativePG dépassent la limite de taille des annotations
      # de `kubectl apply` côté client, et la synchronisation échouerait sur un
      # « metadata.annotations: Too long ». L'application racine porte déjà cette
      # option, mais les Applications filles n'en héritent pas.
      - ServerSideApply=true
