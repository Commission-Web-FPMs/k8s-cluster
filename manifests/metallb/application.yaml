# Installe MetalLB (contrôleur, speakers, CRDs) dans le cluster Kubernetes.
#
# Cette Application ne porte que le chart officiel. La configuration
# (IPAddressPool, L2Advertisement) n'est pas tirée d'ici : elle est appliquée
# directement par l'application racine, via le kustomization de ce dossier.
# C'est ce qui permet à ce fichier de ne pas avoir à redéclarer l'URL du dépôt.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.16.1

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
