apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default

  # ArgoCD s'installe lui-même, à partir du chart officiel.
  #
  # Le bootstrap (voir README, partie 2) pose d'abord une installation
  # minimale avec kubectl, le temps qu'ArgoCD existe et puisse lire ce
  # fichier. Dès la première synchronisation, c'est cette Application qui
  # prend la main : elle applique le chart par-dessus l'installation de
  # bootstrap, en reprend la propriété au champ près, et devient dès lors la
  # seule description de l'installation.
  #
  # Rien n'est donc à répéter ni à modifier pour reconstruire : le bootstrap
  # est un amorçage jetable, pas une configuration parallèle à tenir à jour.
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    # Version fixée d'ArgoCD, peut être mise à jour si nécessaire.
    # Elle commande aussi la version de l'installation de bootstrap : les
    # deux doivent rester alignées, voir le tableau du README.
    targetRevision: 10.8.0

    helm:
      # ----------------------------------------------------------------
      # Configuration d'ArgoCD lui-même.
      #
      # Elle vit ici, dans les valeurs du chart, et non dans un manifeste
      # séparé : le chart produit les ConfigMaps `argocd-cm` et
      # `argocd-rbac-cm`. Les écrire à la main entrerait en conflit avec
      # lui, et le perdant serait celui qui applique en dernier.
      # ----------------------------------------------------------------
      valuesObject:
        configs:
          cm:
            # Personne ne consulte ArgoCD sans s'authentifier.
            "users.anonymous.enabled": "false"

            # Interdit l'ouverture d'un terminal dans un Pod depuis
            # l'interface. Sans cela, un accès en lecture à l'interface
            # devient un accès shell à n'importe quel conteneur du cluster.
            "exec.enabled": "false"

            # TODO sécurité : ce compte est un identifiant unique, partagé et
            # non nominatif, administrateur du cluster, dont la rotation n'est
            # prévue nulle part. Il doit passer à "false", mais seulement une
            # fois qu'un autre moyen de connexion existe, sous peine de
            # verrouiller l'accès à l'interface.
            # Voir docs/securite.md, couche 5.
            "admin.enabled": "true"

            # Connexion via l'organisation GitHub du cercle. Les identifiants
            # ne sont pas ici : $nom-du-secret:clé désigne le Secret scellé
            # github-oauth.sealed.yaml, qu'ArgoCD lit parce qu'il porte
            # l'étiquette app.kubernetes.io/part-of=argocd. Sa fiche, de la
            # création de l'application OAuth à la rotation, est dans
            # github-oauth.md.
            #
            # Une référence qui ne se résout pas n'est pas une erreur pour
            # ArgoCD : il journalise un avertissement et laisse la chaîne
            # telle quelle. L'ordre d'arrivée du Secret n'a donc pas
            # d'importance au bootstrap.
            #
            # Il manque encore `url`, l'adresse publique d'ArgoCD, sans
            # laquelle ArgoCD tient Dex pour non configuré et ignore ce
            # connecteur. Elle sera ajoutée ici même, avec le nom de domaine
            # réel, le jour de l'exposition durable — c'est la seule chose
            # qui manque. Voir github-oauth.md et docs/backlog.md.
            "dex.config": |
              connectors:
                - type: github
                  id: github
                  name: GitHub
                  config:
                    clientID: $argocd-github-oauth:clientID
                    clientSecret: $argocd-github-oauth:clientSecret
                    orgs:
                      - name: Commission-Web-FPMs
                    # Indispensable : sans cela Dex renvoie le nom
                    # d'affichage de l'équipe et non son identifiant d'URL,
                    # et les règles `g` de policy.csv ne correspondraient
                    # à rien.
                    teamNameField: slug

          rbac:
            # Refus par défaut. Une personne authentifiée qui n'est visée par
            # aucune règle ci-dessous n'a aucun droit.
            # Une erreur de configuration échoue donc fermée, et non ouverte.
            "policy.default": ""

            # Permet aux règles `g` de désigner des équipes GitHub une fois la
            # connexion par l'organisation activée.
            scopes: "[groups]"

            # p = permission accordée à un rôle
            # g = rattachement d'un groupe ou d'un compte à un rôle
            #
            # Les rôles par projet étudiant viendront s'ajouter ici, sur le
            # modèle commenté en bas. Ils resteront volontairement limités à
            # la lecture et à la synchronisation de leur propre application.
            "policy.csv": |
              p, role:comweb, applications, *, */*, allow
              p, role:comweb, logs,         get, */*, allow
              p, role:comweb, repositories, *, *, allow
              p, role:comweb, projects,     get, *, allow
              p, role:comweb, clusters,     get, *, allow

              # Inerte tant que la connexion par GitHub n'est pas activée.
              g, Commission-Web-FPMs:comweb, role:comweb

              # Modèle pour un projet étudiant, à décommenter et adapter :
              # p, role:projet-exemple, applications, get,  students/projet-exemple, allow
              # p, role:projet-exemple, applications, sync, students/projet-exemple, allow
              # p, role:projet-exemple, logs,         get,  students/projet-exemple, allow
              # g, Commission-Web-FPMs:projet-exemple, role:projet-exemple

        extraObjects:
          # L'application racine, qui rattache tout le reste du dépôt.
          # Elle est produite par le chart, donc par cette Application : le
          # bootstrap n'a que ce fichier à appliquer, et la chaîne se déroule
          # seule jusqu'aux composants.
          - apiVersion: argoproj.io/v1alpha1
            kind: Application
            metadata:
              name: root
              namespace: argocd
            spec:
              project: default

              source:
                # Cette URL doit être modifiée si le repo est fork
                repoURL: https://github.com/Commission-Web-FPMs/k8s-cluster.git
                targetRevision: main
                path: manifests

              destination:
                server: https://kubernetes.default.svc
                namespace: default

              syncPolicy:
                automated:
                  prune: true
                  selfHeal: true

                syncOptions:
                  - ServerSideApply=true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      # Indispensable ici : c'est ce qui permet de reprendre la propriété des
      # ressources posées par le kubectl du bootstrap sans conflit de champs.
      # ArgoCD applique alors l'équivalent de
      # `kubectl apply --server-side --force-conflicts`.
      - ServerSideApply=true

      # Le namespace argocd est créé à la main au bootstrap, puisqu'il doit
      # exister avant ArgoCD. Cette option le recrée si jamais il disparaît,
      # et évite d'en faire une étape à retenir.
      - CreateNamespace=true
