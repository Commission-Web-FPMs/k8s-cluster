apiVersion: helm.k0sproject.io/v1beta1
kind: Chart
metadata:
  name: argocd
  namespace: kube-system
spec:
  chartName: argo/argo-cd
  releaseName: argocd
  # Version fixée de argocd, peut-être mis à jour si nécessaire
  version:  10.8.0
  namespace: argocd

  repository:
    url: https://argoproj.github.io/argo-helm

  # ne pas utiliser `helm upgrade --force`.
  # Sinon les Secrets générés/modifiés au runtime par ArgoCD
  # peuvent être supprimés puis recréés.
  forceUpgrade: false

  # Ici le repo Github est installé en tant qu'application
  # Puisque ce chart.yaml est déjà dans le dossier manifests/
  # Il sera lui même géré par ArgoCD, par la suite
  # On obtient donc un "self-managed" ArgoCD, qui se met à jour lui-même
  values: |
    configs:
      # ------------------------------------------------------------------
      # Configuration d'ArgoCD lui-même.
      #
      # Elle vit ici, dans les valeurs du chart, et non dans un manifeste
      # séparé : le chart produit les ConfigMaps `argocd-cm` et
      # `argocd-rbac-cm`. Les écrire à la main entrerait en conflit avec lui,
      # et le perdant serait celui qui applique en dernier.
      # ------------------------------------------------------------------
      cm:
        # Personne ne consulte ArgoCD sans s'authentifier.
        "users.anonymous.enabled": "false"

        # Interdit l'ouverture d'un terminal dans un Pod depuis l'interface.
        # Sans cela, un accès en lecture à l'interface devient un accès shell
        # à n'importe quel conteneur du cluster.
        "exec.enabled": "false"

        # TODO sécurité : ce compte est un identifiant unique, partagé et non
        # nominatif, administrateur du cluster, dont la rotation n'est prévue
        # nulle part. Il doit passer à "false", mais seulement une fois qu'un
        # autre moyen de connexion existe, sous peine de verrouiller
        # l'accès à l'interface.
        # Voir docs/securite.md, couche 5.
        "admin.enabled": "true"

        
        # Accessible via tunnels
        url: https://localhost:8443

        dex.config: |
          connectors:
            - type: github
              id: github
              name: GitHub
              config:
                clientID: $argocd-github-oauth:clientID
                clientSecret: $argocd-github-oauth:clientSecret
                orgs:
                  - name: Commission-Web-FPMs
                # Indispensable : sans cela Dex renvoie le nom d'affichage
                # de l'équipe et non son identifiant d'URL, et les règles
                # `g` de policy.csv ne correspondraient à rien.
                teamNameField: slug

      rbac:
        # Refus par défaut. Une personne authentifiée qui n'est visée par
        # aucune règle ci-dessous n'a aucun droit.
        # Une erreur de configuration échoue donc fermée, et non ouverte.
        "policy.default": ""

        # Permet aux règles `g` de désigner des équipes GitHub une fois la
        # connexion par l'organisation activée.
        scopes: "[groups]"

        # p = permission accordée à un rôle
        # g = rattachement d'un groupe ou d'un compte à un rôle
        #
        # Les rôles par projet étudiant viendront s'ajouter ici, sur le
        # modèle commenté en bas. Ils resteront volontairement limités à la
        # lecture et à la synchronisation de leur propre application.
        "policy.csv": |
          p, role:comweb, applications, *, */*, allow
          p, role:comweb, logs,         get, */*, allow
          p, role:comweb, repositories, *, *, allow
          p, role:comweb, projects,     get, *, allow
          p, role:comweb, clusters,     get, *, allow

          # Inerte tant que la connexion par GitHub n'est pas activée.
          g, Commission-Web-FPMs:comweb, role:comweb

          # Modèle pour un projet étudiant, à décommenter et adapter :
          # p, role:projet-exemple, applications, get,  students/projet-exemple, allow
          # p, role:projet-exemple, applications, sync, students/projet-exemple, allow
          # p, role:projet-exemple, logs,         get,  students/projet-exemple, allow
          # g, Commission-Web-FPMs:projet-exemple, role:projet-exemple

    extraObjects:
      - apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: root
          namespace: argocd
        spec:
          project: default

          source:
            # Cette URL doit être modifiée si le repo est fork
            repoURL: https://github.com/Commission-Web-FPMs/k8s-cluster.git
            targetRevision: main
            path: manifests

          destination:
            server: https://kubernetes.default.svc
            namespace: default

          syncPolicy:
            automated:
              prune: true
              selfHeal: true

            syncOptions:
              - ServerSideApply=true