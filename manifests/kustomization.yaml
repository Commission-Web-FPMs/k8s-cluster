apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - argocd/

  # Sealed Secrets : permet de committer des secrets chiffrés dans ce dépôt.
  # En vague -1, donc installé avant les composants qui en dépendent.
  - sealed-secrets/

  # MetalLB : attribue des IP de type LoadBalancer aux services
  - metallb/

  # S3 : permet d'avoir du stockage
  # Devrait être remplacé par un accès au NAS
  - csi-s3/

  # Provisionne des volumes sur le disque local des nœuds, pour les charges
  # qui gèrent elles-mêmes leur redondance. Les classes de stockage qui s'en
  # servent appartiennent aux composants qui les consomment.
  - local-path-provisioner/

  # CloudNativePG : opérateur PostgreSQL, et le cluster à trois instances
  # qu'il pilote.
  - cnpg/
